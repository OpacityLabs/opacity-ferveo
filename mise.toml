[tools]
rust = { version = "1.97.1", profile = "default", components = ["rustfmt", "clippy"] }
"cargo:cargo-machete" = "0.9.2"

[settings]
lockfile = true
experimental = true

[tasks.test]
run = [
  "cargo test --release --workspace",
  "cargo test --release -p ferveo --features experimental-refresh",
]

[tasks.lint]
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy -p ferveo --all-targets --features experimental-refresh -- -D warnings",
  "cargo machete",
]

[tasks.bench-compile]
run = "cargo bench --no-run --workspace"
