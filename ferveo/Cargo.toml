[package]
name = "ferveo"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/OpacityLabs/opacity-ferveo"
description = "An implementation of a DKG protocol for threshold decryption."
keywords = ["DKG"]
categories = ["cryptography"]

[lib]
bench = false

[features]
# Experimental share-refresh and handover protocols (see src/refresh.rs).
# Off by default: opacity-stack does not use them, and they are unaudited.
experimental-refresh = []

[dependencies]
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-poly = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
bincode = { workspace = true }
ferveo-common = { workspace = true }
ferveo-tdec = { workspace = true, features = ["api"] }
hex = { workspace = true }
itertools = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true }
subproductdomain = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
generic-array = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
ferveo-tdec = { workspace = true, features = ["test-common"] }
sha2 = { workspace = true }
test-case = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[[example]]
name = "bench_primitives_size"
path = "examples/bench_primitives_size.rs"

[[bench]]
name = "benchmarks"
path = "benches/bench_main.rs"
harness = false

