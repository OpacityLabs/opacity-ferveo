[workspace]

members = [
    "ferveo",
    "ferveo-common",
    "ferveo-python",
    "ferveo-tdec",
    "ferveo-wasm",
    "subproductdomain",
]

[workspace.dependencies]
anyhow = "1.0.104"
ark-bls12-381 = "0.6.0"
ark-ec = "0.6"
ark-ff = "0.6"
ark-poly = "0.6"
ark-serialize = "0.6"
ark-std = "0.6"
bincode = "1.3.3"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
criterion = "0.8"
console_error_panic_hook = "0.1.7"
derive_more = { version = "2.1", default-features = false }
ferveo-common = { path = "ferveo-common" }
ferveo-tdec = { path = "ferveo-tdec" }
generic-array = "1.4.4"
getrandom = "0.2" # pinned by rand 0.8 (see above)
hex = "0.4"
itertools = "0.15.0"
js-sys = "0.3.103"
miracl_core = "=2.7.0"
pyo3 = "0.18.2"
pyo3-build-config = "*"
rand = "0.8" # pinned by ark-std 0.6, which still re-exports rand 0.8; move in lockstep with arkworks
rand_core = "0.6.4"
serde = "1.0"
serde_bytes = "0.11.19"
serde_with = "3.21.0"
sha2 = "0.11"
subproductdomain = { path = "subproductdomain" }
test-case = "3.3.1"
thiserror = "2.0"
wasm-bindgen = "0.2.126"
wasm-bindgen-derive = "0.4.0"
wasm-bindgen-test = "0.3.76"
zeroize = "1.9.0"

[profile.bench]
opt-level = 3
debug = true
lto = true
codegen-units = 1

# Optimizations are needed such that the tests run in a reasonable timeframe
[profile.test]
opt-level = 3
debug = true

[profile.release]
opt-level = 3
lto = true
