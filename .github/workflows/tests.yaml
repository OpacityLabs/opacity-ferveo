name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Compile the off-by-default experimental refresh/handover code so it
      # cannot silently rot behind the feature gate.
      - name: Clippy (experimental-refresh)
        run: cargo clippy -p ferveo --all-targets --features experimental-refresh -- -D warnings
      # Installed directly with a checksum pin: the cargo-machete action is a
      # wrapper that downloads the *latest* release at runtime, so pinning the
      # action SHA does not pin the binary that actually runs.
      - name: Unused dependencies
        run: |
          curl -sSfL -o "$RUNNER_TEMP/machete.tar.gz" \
            https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz
          echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  $RUNNER_TEMP/machete.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/machete.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-machete-v0.9.2-x86_64-unknown-linux-musl/cargo-machete"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # The suite includes end-to-end DKG ceremonies (transcripts ->
      # aggregation -> encrypt -> threshold decrypt) and the golden-vector
      # wire-format tests pinning serialized-artifact compatibility.
      - name: Tests
        run: cargo test --release --workspace
      # Execute the off-by-default refresh/handover tests too — the clippy
      # pass in the lint job only compiles them.
      - name: Tests (experimental-refresh)
        run: cargo test --release -p ferveo --features experimental-refresh
      - name: Compile benches
        run: cargo bench --no-run --workspace
